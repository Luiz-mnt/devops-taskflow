[project]
name = "devops-taskflow"
version = "2.0.0"
description = "TaskFlow API — CI/CD, infraestrutura e observabilidade em DevOps na Prática"
requires-python = ">=3.12,<3.14"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=app --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov --junitxml=reports/junit.xml"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
